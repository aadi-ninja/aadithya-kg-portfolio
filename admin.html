<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio Admin</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <main class="admin-shell">
    <header class="admin-header">
      <div>
        <p class="hello">Portfolio administration</p>
        <h1>Content dashboard</h1>
      </div>
      <button id="sign-out" class="btn ghost" type="button" hidden>Sign out</button>
    </header>

    <section id="login-panel" class="admin-card">
      <h2>Admin login</h2>
      <form id="login-form">
        <label for="login-email">Email</label>
        <input id="login-email" type="email" autocomplete="email" required value="aadithyakg04@gmail.com">
        <label for="login-password">Password</label>
        <input id="login-password" type="password" autocomplete="current-password" required>
        <button class="btn primary" type="submit">Sign in</button>
      </form>
    </section>

    <section id="dashboard" hidden>
      <p id="dashboard-status" class="admin-status" role="status"></p>

      <article class="admin-card">
        <h2>Hero content</h2>
        <form id="hero-form">
          <label for="hero-intro">Introduction</label>
          <textarea id="hero-intro" rows="4" required></textarea>
          <label for="hero-role">Role label</label>
          <input id="hero-role" required>
          <button class="btn primary" type="submit">Save hero content</button>
        </form>
      </article>

      <article class="admin-card">
        <h2>Projects</h2>
        <form id="project-form" class="admin-grid">
          <input id="project-title" placeholder="Title" required>
          <select id="project-category" required>
            <option value="personal">Personal</option>
            <option value="hackathon">Hackathon</option>
            <option value="internship">Internship</option>
          </select>
          <input id="project-technologies" placeholder="Technologies, comma separated">
          <input id="project-url" type="url" placeholder="Project URL">
          <textarea id="project-description" placeholder="Description" rows="3" required></textarea>
          <button class="btn primary" type="submit">Add project</button>
        </form>
        <div id="projects-list" class="admin-list"></div>
      </article>

      <article class="admin-card">
        <h2>Certifications</h2>
        <form id="certification-form" class="admin-grid">
          <input id="certification-issuer" placeholder="Issuer" required>
          <input id="certification-title" placeholder="Title" required>
          <input id="certification-issued" placeholder="Issued date" required>
          <input id="certification-url" type="url" placeholder="Certificate URL" required>
          <button class="btn primary" type="submit">Add certification</button>
        </form>
        <div id="certifications-list" class="admin-list"></div>
      </article>
    </section>
  </main>
  <script type="module" src="admin.js"></script>
</body>
</html>
